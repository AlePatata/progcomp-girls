name: auto-pre-release

on:
  push:
    branches: [ "main" ]

jobs:
  compile_and_release:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Typst
      run: |
        wget https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
        tar -xf typst-x86_64-unknown-linux-musl.tar.xz
        sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

    - name: Compile Document
      run: |
        typst compile main.typ
        ls -al # List files to check if main.pdf exists

    - name: Get commit sha and date
      id: sha_date
      run: |
        echo "build_date=$(date +%Y.%m)" >> "$GITHUB_OUTPUT"
        echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: 'v${{ steps.sha_date.outputs.build_date }}+${{ steps.sha_date.outputs.sha_short }}'
        name: 'Prerelease on ${{ steps.sha_date.outputs.build_date }} for commit ${{ steps.sha_date.outputs.sha_short }}'
        draft: false
        prerelease: true
        files: main.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

